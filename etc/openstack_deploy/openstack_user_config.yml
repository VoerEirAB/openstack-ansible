###
### Infrastructure
###

_infrastructure_hosts: &infrastructure_hosts
  infra1:
    ip: 172.16.227.141
    no_containers: true

# nova hypervisors
compute_hosts: &compute_hosts
  # voereir13
  compute1:
    ip: 172.16.227.143
  # voereir14
  compute2:
    ip: 172.16.227.144
    host_vars:
      voereir_nova_ram_allocation_ratio: 4.0
  # voereir15
  compute3:
    ip: 172.16.227.145
    host_vars:
      voereir_nova_cpu_model: IvyBridge-IBRS
