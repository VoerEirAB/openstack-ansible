---
cidr_networks: &cidr_networks
  #management: 10.0.0.0/24
  management: 172.16.227.0/24
  tunnel: 192.168.11.0/24
  #storage: 20.0.0.0/24
  #sriov: 30.0.0.0/24

used_ips:
  - "172.16.227.1,172.16.227.65"
  - "172.16.227.201,172.16.227.220"
  - "172.16.227.101,172.16.227.171"

global_overrides:
  cidr_networks: *cidr_networks
  internal_lb_vip_address: 172.16.227.127
  #
  # The below domain name must resolve to an IP address
  # in the CIDR specified in haproxy_keepalived_external_vip_cidr.
  # If using different protocols (https/http) for the public/internal
  # endpoints the two addresses must be different.
  #
  external_lb_vip_address: antelope.voereir.io
  #external_lb_vip_address: 172.16.227.111
  management_bridge: "br-mgmt"
  provider_networks:
    - network:
        container_bridge: "br-mgmt"
        container_type: "veth"
        container_interface: "eno1"
        ip_from_q: "management"
        type: "raw"
        group_binds:
          - all_containers
          - hosts
        is_management_address: true
    - network:
        container_bridge: "br-vxlan"
        container_type: "veth"
        container_interface: "eno1"
        ip_from_q: "tunnel"
        type: "vxlan"
        range: "1:1000"
        container_mtu: "9000"
        net_name: "vxlan"
        group_binds:
          - neutron_openvswitch_agent
    - network:
        container_bridge: "br-flat"
        container_type: "veth"
        container_interface: "eno1"
        container_mtu: "9000"
        type: "flat"
        net_name: "physnet1"
        group_binds:
          - neutron_openvswitch_agent
    - network:
        container_bridge: "br-vlan"
        container_type: "veth"
        container_interface: "enp8s0f1"
        type: "vlan"
        range: "1000:1009"
        container_mtu: "9000"
        net_name: "sriovnet1"
        sriov_host_interfaces: "enp8s0f1"
        group_binds:
          - neutron_openvswitch_agent
          - neutron_sriov_nic_agent

   #- network:
   #        container_bridge: "br-dpdk"
